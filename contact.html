<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <script src="./scripts/theme.js" defer></script>
    <title>Contact-Form</title>
    <style>
        body {
            background-image: url("coral_poka.png");
            background-repeat: no-repeat;
            background-size: 1920px;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <a href="#main-content-contact" class="skip-link">Skip to main content</a>
    <button type="button" id="theme-toggle">Toggle Dark Mode</button>
      <header id="front-header">
        <nav aria-label="Logo navigation">
          <h1 id="home-header" style="color: var(--text)">Home</h1>
          <img src="resume-7.png" alt="Resume logo" width="60px" height="60px" />
          <h2 id="name-header" style="color: var(--text)">Caleb Pelletier</h2>
        </nav>
        <nav aria-label="Primary navigation">
          <ul class="header-row">
            <li><a href="index.html" style="color: var(--text)">Home Page</a></li>
            <li><a href="resume.html" style="color: var(--text)">My Resume</a></li>
            <li><a href="contact.html" aria-current="page">Contact Me</a></li>
            <li><a href="bento-grid.html" style="color: var(--text)">Bento Grid</a></li>
            <li><a href="weather.html" style="color: var(--text)">Check Weather</a></li>
          </ul>
        </nav>
      </header>
    
    <h3 id="contact-form">Contact Form</h3>
    <main id="main-content-contact">
        <section>
            <h2 id="enter-contact" style="color: white;">Enter Contact Information</h2>
            
            <form>
                <input type="text" id="first-name-input" name="name-input" placeholder="First name" required />
                <input type="text" id="last-name-input" name="name-input" placeholder="Last name" required />
                <input type="email" id="email-input" name="name-input" placeholder="Email" required />
                
                <div>
                    <textarea id="message-input" rows="4" cols="50" placeholder="Enter Your Message..."></textarea>
                </div>
                <input type="reset" value="Submit" style="border-radius: 1000px;">
            </form>
        </section>
    </main>
</body>
</html>
