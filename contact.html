<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>Contact-Form</title>
    <style>
        body {
            background-image: url("coral_poka.png");
            background-repeat: no-repeat;
            background-size: 1920px;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
      <header id="front-header">
        <nav>
          <img src="resume-7.png" width="60px" height="60px" />
          <h2 id="name-header">Caleb Pelletier</h2>
        </nav>
        
        <nav>
            <ul id="main-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="resume.html">Resume</a></li>
            </ul>
        </nav>
      </header>
    
    <h3 id="contact-form">Contact Form</h3>
    <section>
            <h2 id="enter-contact">Enter Contact Information</h2>
            
            <form>
                <input type="text" id="first-name-input" name="name-input" placeholder="First name" required />
                <input type="text" id="last-name-input" name="name-input" placeholder="Last name" required />
                <input type="email" id="email-input" name="name-input" placeholder="Email" required />
                
                <div>
                    <textarea id="message-input" rows="4" cols="50" placeholder="Enter Your Message..."></textarea>
                </div>
                <input type="reset" value="Submit" style="border-radius: 1000px;">
            </form>
        </section>
</body>
</html>
